<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}南锣鼓巷导览{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8B4513;
            --secondary-color: #D2691E;
            --bg-color: #FFF8DC;
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1508804185872-d7badad00f7d?w=1200') center/cover;
            color: white;
            padding: 80px 0;
            margin-bottom: 30px;
        }
        .poi-card img {
            height: 180px;
            object-fit: cover;
        }
        .category-badge {
            background-color: var(--secondary-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .favorite-btn {
            cursor: pointer;
            font-size: 1.5rem;
        }
        .favorite-btn.active {
            color: #e74c3c;
        }
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 20px 0;
            margin-top: 40px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'tour:index' %}">
                <i class="bi bi-house-door"></i> 南锣鼓巷导览
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tour:index' %}">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tour:poi_list' %}">景点</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tour:route_list' %}">路线</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tour:favorites' %}">
                            <i class="bi bi-heart"></i> 收藏
                        </a>
                    </li>
                </ul>
                <form class="d-flex" action="{% url 'tour:search' %}" method="get">
                    <input class="form-control me-2" type="search" name="q" placeholder="搜索景点...">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="text-center">
        <div class="container">
            <p class="mb-0">© 2026 南锣鼓巷智慧导览系统 | 软件工程课程设计</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
